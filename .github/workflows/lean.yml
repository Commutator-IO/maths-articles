name: lean

# The Lean 4 formalisations kept next to the documents (lecons/**/*.lean),
# checked against the Mathlib pinned in lean/lake-manifest.json.
on:
  push:
    branches: [main]
    paths: ['lecons/**/*.lean', 'lean/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lecons/**/*.lean', 'lean/**', '.github/workflows/lean.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Check the proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Lean version from lean/lean-toolchain, fetches Mathlib's
      # prebuilt cache and runs `lake build` (the root, which is empty).
      # Pinned version. Since v1.6.0, the action computes the GitHub cache key
      # correctly when the Lake package lives in a subdirectory, as here
      # (lean/).
      - uses: leanprover/lean-action@v1.6.2
        with:
          lake-package-directory: lean

      # Every file, with warnings treated as errors; `sorry`, `native_decide`
      # and `axiom` are refused.
      - name: Check lecons/**/*.lean
        working-directory: lean
        run: ./check.sh
