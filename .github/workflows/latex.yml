name: latex

# Chaque document de lecons/ doit compiler. Les PDF sont gardés 30 jours
# comme artefact du run, pour relire une pull request sans rien installer.
on:
  push:
    branches: [main]
    paths: ['lecons/**/*.tex', 'scripts/pdf.mjs', '.github/workflows/latex.yml']
  pull_request:
    paths: ['lecons/**/*.tex', 'scripts/pdf.mjs', '.github/workflows/latex.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: Compiler avec Tectonic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Tectonic plutôt que TeX Live : un binaire, qui ne télécharge que les
      # paquets utilisés. Son cache de paquets est gardé entre les runs.
      - name: Installer Tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1

      # Ici, un document qui ne compile pas fait échouer le run.
      - name: Compiler
        run: node scripts/pdf.mjs --require

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ github.sha }}
          path: dist/lecons/**/*.pdf
          retention-days: 30
