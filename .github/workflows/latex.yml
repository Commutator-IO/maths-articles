name: latex

# Every document under lecons/ must compile. The PDFs are kept for 30 days as
# a run artifact, so a pull request can be read without installing anything.
on:
  push:
    branches: [main]
    paths: ['lecons/**/*.tex', 'scripts/pdf.mjs', '.github/workflows/latex.yml']
  pull_request:
    paths: ['lecons/**/*.tex', 'scripts/pdf.mjs', '.github/workflows/latex.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: Compile with Tectonic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Tectonic rather than TeX Live: a single binary that downloads only the
      # packages a document uses. Its package cache is kept between runs.
      - name: Install Tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1

      # Here, a document that does not compile fails the run.
      - name: Compile
        run: node scripts/pdf.mjs --require

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ github.sha }}
          path: dist/lecons/**/*.pdf
          retention-days: 30
