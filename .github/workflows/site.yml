name: site

# The site: reading views rendered from lecons/**/*.tex, the index of leçons,
# the sources and the PDFs. Checked on every pull request; published to GitHub
# Pages from main only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall copies KaTeX into public/vendor/katex/, which the reading
      # views load; it is not versioned.
      - run: npm ci

      # The PDFs are built here and never versioned. A document that does not
      # compile does not block publication: its page simply has no PDF link.
      # The latex workflow is the one that fails the pull request in that case.
      - name: Install Tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1
      - name: Compile the PDFs
        run: npm run pdf -- --require || echo "::warning::at least one PDF did not compile (see the latex workflow)"

      # A .tex outside the supported subset, a reference without a label or a
      # formula that KaTeX rejects fails this step.
      - name: Render the reading views
        run: npm run render

      # The agreg.commutator.io domain is set in the repository's Pages
      # settings; public/CNAME, copied as is into dist/, records it. This step
      # guards the file against accidental deletion.
      - name: Check the custom domain
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing: the agreg.commutator.io domain would be lost"; exit 1; }
          cat dist/CNAME

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
